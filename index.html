<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dorfromantik - Spielauswahl</title>
  <script src="https://cdn.tailwindcss.com"></script>

<!-- Google Fonts: Sniglet für den abgerundeten Dorfromantik-Look -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Niramit:wght@500;700&display=swap" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@700;800&family=Niramit:wght@500;700&display=swap');

    body {
      font-family: 'Niramit', sans-serif;
      /* Dorfromantik-Grün mit sanftem Verlauf für maximale Gemütlichkeit */
      background: linear-gradient(180deg, #768151 0%, #5d673f 100%);
      background-attachment: fixed;
    }

    .title-font {
      font-family: 'Fredoka', sans-serif;
      font-weight: 500; /* Angenehme, mittlere Strichstärke */
    }

    /* Kachel-Styling mit Touch-Feedback */
    .game-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .game-card:active {
      transform: scale(0.97);
    }

    /* Bild-Container für perfektes Handy-Seitenverhältnis */
    .banner-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      background-color: #f5efe6; /* Weicher Hintergrund für eventuelle Ränder */
    }

    @media (min-width: 640px) {
      .banner-img {
        height: 180px;
      }
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

  <!-- Header -->
  <header class="p-5 text-center border-b border-white/10 bg-black/20 backdrop-blur-md sticky top-0 z-10 shadow-sm">
    <h1 class="text-2xl text-emerald-100 title-font tracking-wider">DORFROMANTIK</h1>
    <p class="text-xs font-semibold text-emerald-200/80 mt-0.5 tracking-wider uppercase">Wähle dein Spiel</p>
  </header>

  <!-- Hauptbereich: Spielauswahl -->
  <main class="max-w-md mx-auto p-4 space-y-4 mt-2">

    <!-- 1. Das Brettspiel -->
    <div onclick="selectGame('brettspiel')" class="game-card bg-white rounded-2xl overflow-hidden shadow-md border border-stone-200/80 cursor-pointer">
      <img src="Bilder/das_brettspiel.png" alt="Dorfromantik - Das Brettspiel" class="banner-img">
      <div class="p-3 bg-white flex justify-between items-center border-t border-stone-100">
        <span class="font-bold text-stone-800 text-base">Das Brettspiel</span>
        <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">Öffnen →</span>
      </div>
    </div>

    <!-- 2. Das Duell -->
    <div onclick="selectGame('duell')" class="game-card bg-white rounded-2xl overflow-hidden shadow-md border border-stone-200/80 cursor-pointer">
      <img src="Bilder/das_duell.png" alt="Dorfromantik - Das Duell" class="banner-img">
      <div class="p-3 bg-white flex justify-between items-center border-t border-stone-100">
        <span class="font-bold text-stone-800 text-base">Das Duell</span>
        <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">Öffnen →</span>
      </div>
    </div>

    <!-- 3. Sakura -->
    <div onclick="selectGame('sakura')" class="game-card bg-white rounded-2xl overflow-hidden shadow-md border border-stone-200/80 cursor-pointer">
      <img src="Bilder/sakura.png" alt="Dorfromantik - Sakura" class="banner-img">
      <div class="p-3 bg-white flex justify-between items-center border-t border-stone-100">
        <span class="font-bold text-stone-800 text-base">Sakura</span>
        <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">Öffnen →</span>
      </div>
    </div>

    <!-- 4. Südsee -->
    <div onclick="selectGame('suedsee')" class="game-card bg-white rounded-2xl overflow-hidden shadow-md border border-stone-200/80 cursor-pointer">
      <img src="Bilder/suedsee.png" alt="Dorfromantik - Südsee" class="banner-img">
      <div class="p-3 bg-white flex justify-between items-center border-t border-stone-100">
        <span class="font-bold text-stone-800 text-base">Südsee</span>
        <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">Öffnen →</span>
      </div>
    </div>

  </main>

  <script>
    function selectGame(gameId) {
      console.log("Ausgewähltes Spiel:", gameId);
      alert("Du hast '" + gameId + "' gewählt. Hier öffnen wir als Nächstes die Kampagnen!");
    }

    function selectGame(gameId) {
      if (gameId === 'brettspiel') {
        window.location.href = 'das_brettspiel.html';
      } else {
        alert("Das Modul für " + gameId + " kommt als Nächstes!");
      }
    }
  </script>
</body>
</html>
